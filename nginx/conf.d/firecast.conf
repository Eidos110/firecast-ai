# =============================================================================
# FireCast Nginx Configuration (post-React-SPA migration, TAHAP E)
# =============================================================================
# Single upstream: FastAPI serves BOTH the API and the compiled React SPA.
# `start_api.py` mounts the SPA at `/` and falls back to `index.html` for any
# unknown GET (history-mode client routing). Nginx only adds:
#   - TLS termination
#   - security headers
#   - HTTP -> HTTPS redirect
#   - long-cache policy for hashed assets
#
# Place your SSL certificate and key in nginx/ssl/ (self-signed testing):
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout nginx/ssl/firecast.key -out nginx/ssl/firecast.crt
# =============================================================================

upstream firecast_app {
    # `firecast` is the docker-compose service name; override for bare-metal.
    server firecast:7860;
}

# --- HTTP -> HTTPS redirect ---------------------------------------------------
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

# --- HTTPS endpoint ----------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/firecast.crt;
    ssl_certificate_key /etc/nginx/ssl/firecast.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Hashed SPA assets (immutable, long-lived) --------------------------
    # Vite emits content-hashed filenames under /assets/, so they are safe to
    # cache forever. `index.html` (which references them) is served uncached
    # by FastAPI itself; nginx does not need a special rule for it.
    location /assets/ {
        proxy_pass http://firecast_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # --- API surface — reserved prefixes take precedence over SPA fallback --
    # Order matters: these locations are matched first because nginx selects
    # the longest prefix match, not declaration order, but listing them
    # explicitly helps operators audit the routing table.
    location /predict {
        proxy_pass http://firecast_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /weather            { proxy_pass http://firecast_app; }
    location /geo/              { proxy_pass http://firecast_app; }
    location /analytics/        { proxy_pass http://firecast_app; }
    location /api/             { proxy_pass http://firecast_app; }
    location /admin/           { proxy_pass http://firecast_app; }
    location /precompute_progress { proxy_pass http://firecast_app; }
    location /health           { proxy_pass http://firecast_app; }
    location /docs             { proxy_pass http://firecast_app; }
    location /openapi.json     { proxy_pass http://firecast_app; }
    location /redoc            { proxy_pass http://firecast_app; }

    # --- SPA shell + history-mode fallback -----------------------------------
    # Everything else (and the bare ``/``) goes to FastAPI's SPA fallback,
    # which returns index.html for client-side routes like /analysis.
    location / {
        proxy_pass http://firecast_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout                 300s;
        proxy_connect_timeout              75s;
    }
}
