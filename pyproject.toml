[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "firecast"
version = "1.0.0"
description = "Fire Forecasting Ensemble Model using CNN + LightGBM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FireCast Team", email = "team@firecast.com"},
]
keywords = [
    "fire",
    "forecasting",
    "machine-learning",
    "ensemble",
    "cnn",
    "lightgbm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.0.3",
    "scikit-learn>=1.9.0",
    "torch>=2.4.1",
    "lightgbm==4.6.0",
    "xgboost==3.3.0",
    "shap>=0.45.0",
    "joblib>=1.3.1",
    "matplotlib>=3.7.2",
    "seaborn>=0.12.2",
    "tqdm>=4.66.1",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    # Geospatial
    "shapely>=2.0.0",
    "geopandas>=0.14.0",
    "h3>=3.7.6",
    "pillow>=10.0.0",
    "sqlmodel>=0.0.14",
    "earthengine-api>=0.1.371",
    # API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "apscheduler>=3.10.4",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipython>=8.14.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "pre-commit>=3.5.0",
    "yoyo-migrations>=8.2",
    "nbstripout>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/firecast"
Documentation = "https://github.com/yourusername/firecast/wiki"
Repository = "https://github.com/yourusername/firecast.git"
Issues = "https://github.com/yourusername/firecast/issues"

[project.scripts]
firecast = "main:main"

[tool.setuptools]
packages = [
    "src",
    "src.api",
    "src.features",
    "src.geo",
    "src.models",
    "src.utils",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "firecast-private", "tmp-space-deploy", "frontend_react/build", "frontend_react/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line-too-long handled by black
    "B008",   # function-call-in-default-argument (FastAPI Security() pattern)
    "SIM108", # ternary instead of if-else (readability)
    "B904",   # raise-from-err: noisy churn for existing exception chains (AGENTS.md flags refactor only)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402"]  # assert ok; sys.path tweaks require late imports
"src/config.py" = ["E402"]    # late imports intentional (lazy torch guard)
"src/predict.py" = ["F821", "E402"]   # module-globals lazy registration pattern; late import
"src/models/causal_gru.py" = ["F821"]  # __main__ defines class lazily
"src/models/registry.py" = ["E402", "E712"]  # late imports + bool column comparison (the F821 NameError was fixed by src/utils/path_safety.py)

# =============================================================================
# pytest markers & coverage configuration.
# =============================================================================
# ``integration`` marks the FastAPI TestClient end-to-end smoke; there is no
# Streamlit surface left post-migration, so no ``frontend``/``slow`` markers
# are needed any more. Coverage is configured via [tool.coverage.run] and the
# CLI args in ci.yml — we do NOT bake ``--cov-fail-under`` into addopts so
# local ``pytest tests/`` stays developer-friendly. The CI gate asserts the
# bar instead.
[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "integration: cross-module end-to-end smoke (FastAPI TestClient + src pipeline)",
]
filterwarnings = [
    # Pre-existing sklearn/xgboost pickle version-mismatch warnings (AGENTS.md
    # §5.B) — noise in CI logs, not actionable for the UI revamp tests.
    "ignore::UserWarning:sklearn.exceptions.InconsistentVersionWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
branch = true
source = ["src", "frontend/utils"]
omit = [
    "*/__main__.py",
    "*/tests/*",
    "*/node_modules/*",
    "*/frontend_react/*",
    "*/_preview_ui/*",
]

[tool.coverage.report]
# ``fail_under`` is the global floor that guards src against erosion; the
# dedicated CI step (ci.yml job ``python``) owns the per-package bar.
# Local developers who want a stricter gate can run e.g.:
#   pytest --cov=src --cov-fail-under=60 tests/
fail_under = 40
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if __typing.TYPE_CHECKING:",
]

