[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "firecast"
version = "4.0.0"
description = "Fire risk forecasting API and React SPA (V4.2 two-leg stack + legacy CNN/LGBM)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FireCast Team", email = "team@firecast.com"},
]
keywords = [
    "fire",
    "forecasting",
    "machine-learning",
    "stacking",
    "lightgbm",
    "xgboost",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core data/ML
    "numpy>=1.26,<2",
    "pandas>=2.0.3",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.9.0",
    "torch>=2.4.1",
    "lightgbm==4.6.0",
    "xgboost==3.3.0",
    "shap>=0.45.0",
    "joblib>=1.3.1",
    # Geospatial (AOI point-in-polygon)
    "shapely>=2.0.0",
    # API / persistence
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "orjson>=3.10.0",
    "cachetools>=5.5.0",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.14",
    "python-dotenv>=1.0.0",
    # Optional observability (no-op when unconfigured)
    "sentry-sdk[fastapi]>=1.40.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipython>=8.14.0",
    "ipykernel>=6.25.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "hypothesis>=6.88.0",
    "httpx>=0.25.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "pre-commit>=3.5.0",
    "nbstripout>=0.7.0",
]

[tool.setuptools]
packages = [
    "src",
    "src.api",
    "src.features",
    "src.geo",
    "src.models",
    "src.utils",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "notebooks",
    # Executed artifacts: notebook cells carry embedded outputs from real training
    # runs; auto-fix would desync source from recorded outputs. Training notebooks
    # are verified by deterministic re-execution (SEED pinned, metrics asserted),
    # not by lint.
    "*.ipynb",
    "firecast-private",
    "tmp-space-deploy",
    "frontend_react/build",
    "frontend_react/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line-too-long handled by black
    "B008",   # function-call-in-default-argument (FastAPI Security() pattern)
    "SIM108", # ternary instead of if-else (readability)
    "B904",   # raise-from-err: noisy churn for existing exception chains (AGENTS.md flags refactor only)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402"]  # assert ok; sys.path tweaks require late imports
"scripts/inference.py" = ["E402"]  # sys.path bootstrap requires late import (same pattern as tests/*)
"src/config.py" = ["E402"]    # late imports intentional (lazy torch guard)
"src/predict.py" = ["F821", "E402"]   # module-globals lazy registration pattern; late import
"src/models/registry.py" = ["E402", "E712"]  # late imports + bool column comparison (the F821 NameError was fixed by src/utils/path_safety.py)

# =============================================================================
# pytest markers & coverage configuration.
# =============================================================================
# ``integration`` marks the FastAPI TestClient end-to-end smoke; there is no
# Streamlit surface left post-migration, so no ``frontend``/``slow`` markers
# are needed any more. Coverage is configured via [tool.coverage.run] and the
# CLI args in ci.yml — we do NOT bake ``--cov-fail-under`` into addopts so
# local ``pytest tests/`` stays developer-friendly. The CI gate asserts the
# bar instead.
[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "integration: cross-module end-to-end smoke (FastAPI TestClient + src pipeline)",
]
filterwarnings = [
    # Pre-existing sklearn/xgboost pickle version-mismatch warnings (AGENTS.md
    # §5.B) — noise in CI logs, not actionable for the UI revamp tests.
    "ignore::UserWarning:sklearn.exceptions.InconsistentVersionWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/__main__.py",
    "*/tests/*",
    "*/node_modules/*",
    "*/frontend_react/*",
]

[tool.coverage.report]
# ``fail_under`` is the global floor that guards src against erosion; the
# dedicated CI step (ci.yml job ``python``) owns the per-package bar.
# Local developers who want a stricter gate can run e.g.:
#   pytest --cov=src --cov-fail-under=60 tests/
fail_under = 40
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if __typing.TYPE_CHECKING:",
]

