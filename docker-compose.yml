# =============================================================================
# FireCast Docker Compose Configuration (post-React-SPA migration, TAHAP E)
# =============================================================================
# Single-process model: one uvicorn worker serves the FastAPI API AND the
# compiled React SPA from /app/frontend_react/build. No separate frontend
# / api / nginx tier is needed in dev unless the operator wants TLS.
#
# Usage:
#   docker-compose up -d            # build + run the all-in-one service
#   docker-compose up -d --build    # force rebuild (e.g. after SPA src change)
#   docker-compose logs -f firecast
#   docker-compose down
#
# For HTTPS / reverse-proxy in production add the `nginx` profile (see below).
# =============================================================================

version: "3.8"

services:
  firecast:
    build:
      context: .
      target: base
    container_name: firecast
    ports:
      - "7860:7860"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=WARNING
      - HOST=0.0.0.0
      - PORT=7860
      - ENABLE_DEMO_MODE=false
      - ML_DEVICE=cpu
      - ENABLE_CORS=true
      - ALLOWED_ORIGINS=*
    env_file:
      - .env
    volumes:
      # Mount models + data read-only so host updates are reflected without rebuild.
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - firecast

  # Optional HTTPS reverse proxy (use only with --profile production)
  nginx:
    image: nginx:1.25-alpine
    container_name: firecast-nginx
    profiles:
      - production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/www:/var/www/html:ro
    restart: unless-stopped
    depends_on:
      - firecast
    networks:
      - firecast

networks:
  firecast:
    driver: bridge

volumes:
  firecast-models:
